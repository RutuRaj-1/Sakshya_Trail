services:
  # =================================================================
  # 1. SAKSHYATRAIL BACKEND (FastAPI / Python Web Service)
  # =================================================================
  - type: web
    name: sakshyatrail-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DOCUMENT_STORAGE_BACKEND
        value: firebase
      - key: FIREBASE_STORAGE_ENABLED
        value: true
      - key: FIREBASE_STORAGE_BUCKET
        value: sih-26265-fdr.firebasestorage.app
      - key: SAKSHYATRAIL_DEMO_MODE
        value: true
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,https://*.vercel.app,http://localhost:5173"

  # =================================================================
  # 2. SAKSHYATRAIL FRONTEND (React / Vite Web Service)
  # =================================================================
  - type: web
    name: sakshyatrail-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: sakshyatrail-backend
          property: host
